x-api-environment: &api-environment
  POSTGRES_DB: ${POSTGRES_DB:-aura}
  POSTGRES_USER: ${POSTGRES_USER:-aura}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_local_password}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  API_PORT: 3001
  JWT_SECRET: ${JWT_SECRET:?Run npm start to generate root .env secrets first}
  AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-commander}
  AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:?Run npm start to generate root .env secrets first}
  HEALTH_SWEEP_ENABLED: ${HEALTH_SWEEP_ENABLED:-true}
  HEALTH_SWEEP_INTERVAL_SECONDS: ${HEALTH_SWEEP_INTERVAL_SECONDS:-60}
  TASK_QUEUE_ENABLED: ${TASK_QUEUE_ENABLED:-true}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-aura}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}

services:
  bootstrap:
    image: aura-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    command: ["node", "scripts/run.mjs", "bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  api:
    image: aura-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  worker:
    image: aura-api:local
    restart: unless-stopped
    environment: *api-environment
    command: ["node", "scripts/run.mjs", "worker"]
    stop_grace_period: 60s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/run.mjs", "worker-health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aura}
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aura-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - aura-redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  aura-postgres-data:
  aura-redis-data:
