name: Verify complete startup
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start from a clean database
        run: npm start
      - name: Check page and API proxy
        run: |
          curl --fail http://localhost:3000/ > /dev/null
          curl --fail http://localhost:3000/api/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/missions/current)" = 401
          node scripts/verify-proxy.mjs
          docker compose exec -T api node scripts/run.mjs ci-test
          docker compose exec -T -e WORKER_SMOKE_API_URL=http://web:3000/api/v1 api node scripts/run.mjs worker-smoke
      - name: Prepare isolated UI fixture
        run: node scripts/web-e2e-fixtures.mjs
      - name: Browser workspace journey
        run: npm run test:web
      - name: Remove isolated UI fixture
        if: always()
        run: node scripts/web-e2e-fixtures.mjs cleanup
      - name: Verify restart without duplicate seed data
        run: |
          docker compose down
          npm start
          docker compose exec -T api node scripts/run.mjs smoke
          node scripts/verify-proxy.mjs
          docker compose exec -T -e WORKER_SMOKE_API_URL=http://web:3000/api/v1 api node scripts/run.mjs worker-smoke
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
